# =========================
#   GLOBEM-like RAPIDS run
# =========================
PROJECT_NAME: globem_standalone

# ---- Sources: pick ONE of these blocks ----

# 1) Use AWARE MySQL directly (recommended if your AWARE server is still live)
DATA_STREAMS:
  PHONE:
    SOURCE: aware_mysql
    PARAMS:
      HOST: "91.98.172.113"
      PORT: 3306
      USER: "root"
      PASSWORD: "rootpassword"
      DB_NAME: "aware"
      # RAPIDS expects standard AWARE table names (e.g., locations, screen ...)
      # If yours are prefixed, set RAPIDS' table options accordingly.

# ---- Participants map: pid↔device ids + timezone
PARTICIPANTS:
  FILE: "data/external/participants.csv"

# Example RAPIDS time segment config: daily windows
TIME_SEGMENTS:
  SEGMENTS:
    - NAME: DAY
      SIZE_MINUTES: 1440
      SHIFT_MINUTES: 0
      START_OF_DAY: "04:00"    # typical mobile-sensing day start
      LABEL: "date"

# ---- Phone sensors (enable what you collected)
PHONE_FEATURES:
  PHONE_LOCATIONS:
    ENABLED: true
    PROVIDERS:
      - RAPIDS   # RAPIDS' built-in phone location features
    PARAMS:
      RESAMPLE: true         # standardize timestamps to bins internally
      # Provider defaults compute variance, entropy, distance, home-stay, etc.

  PHONE_SCREEN:
    ENABLED: true
    PROVIDERS:
      - RAPIDS
    PARAMS:
      # Uses on/off/unlock events to compute unlock counts, duration, routines, etc.
      MIN_EPISODE_SEC: 5

  # Uncomment if you also have these sources enabled/available
  # PHONE_BLUETOOTH:
  #   ENABLED: true
  #   PROVIDERS: [RAPIDS]
  # PHONE_CALLS:
  #   ENABLED: true
  #   PROVIDERS: [RAPIDS]

# Fitbit features (GLOBEM used Fitbit Steps/Sleep; enable these only if you have Fitbit data)
FITBIT_FEATURES:
  ENABLED: false

# ---- Outputs
OUTPUT:
  # RAPIDS default folders/files
  # We’ll copy results into output/FeatureData in run_rapids.sh
  MERGE_ALL_PARTICIPANTS: true
  SAVE_PER_SENSOR_FILES: true
  SAVE_PER_PARTICIPANT_FILES: false

# ---- Cleaning/merging (RAPIDS’ example workflow exposes these knobs; defaults are safe)
CLEANING:
  DROP_DAYS_WITH_LOW_DATA_YIELD: false
  DROP_FEATURES_WITH_MANY_MISSING: false
  DROP_ZERO_VARIANCE_FEATURES: false

# ---- Execution
EXECUTION:
  CORES: 1
  VERBOSITY: 1
